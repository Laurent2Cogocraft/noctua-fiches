<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Noctua — Fiches de personnage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17130e; --bg2:#1f1810; --panel:#2a2216; --panel2:#332913;
    --line:#3d3220; --ink:#ece0c8; --muted:#9c8f74;
    --gold:#d7a13c; --venom:#8bbf3f; --blood:#c0503f;
    --water:#4aa3c7; --rest:#9b7fd0; --food:#d7a13c;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{min-height:100%}
  body{
    margin:0;overflow-x:hidden;
    background:radial-gradient(1200px 600px at 50% -10%, #2a2013 0%, rgba(42,32,19,0) 60%), var(--bg);
    color:var(--ink);font-family:"Rubik",system-ui,sans-serif;line-height:1.45;
    -webkit-font-smoothing:antialiased;min-height:100dvh;
  }
  .wrap{max-width:620px;margin:0 auto;padding:16px 14px 80px}
  h1,h2,h3{font-family:"Cinzel",serif;font-weight:600;margin:0}
  a{color:var(--gold)}
  button{font-family:inherit}
  .muted{color:var(--muted)}
  .hidden{display:none!important}

  /* Login */
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
  .login-card{width:100%;max-width:360px;text-align:center}
  .brand{font-family:"Cinzel",serif;font-size:34px;letter-spacing:2px;color:var(--gold)}
  .brand-sub{color:var(--muted);margin:4px 0 26px;font-size:14px}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0}
  .field{text-align:left;margin:12px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
  textarea{resize:vertical;min-height:64px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
  .btn{background:var(--gold);color:#241a08;border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.mini{width:auto;padding:7px 11px;font-size:13px;border-radius:8px}
  .msg{margin-top:12px;font-size:14px;min-height:18px}
  .msg.err{color:var(--blood)}

  /* Top bar */
  .topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
  .topbar select{width:auto;flex:1;min-width:0}
  .who{font-size:13px;color:var(--muted)}

  /* Identity */
  .idcard{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .idname{font-size:26px;color:var(--gold);line-height:1.1}
  .idmeta{color:var(--muted);font-size:13px;margin-top:6px}
  .roflag{display:inline-block;font-size:11px;color:var(--venom);border:1px solid var(--venom);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .readonly-note{color:var(--blood);font-size:12px;margin-top:8px}

  /* Panels */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .panel > h2{font-size:15px;letter-spacing:.5px;color:var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .panel > h2 .count{font-family:"Rubik";font-size:12px;color:var(--muted);font-weight:400}
  .subh{font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.5px}

  /* Vitals */
  .vitals{text-align:center}
  .hp-num{font-family:"Cinzel";font-size:52px;line-height:1}
  .hp-num small{font-size:22px;color:var(--muted)}
  .hp-label{color:var(--muted);font-size:12px;letter-spacing:2px;margin-bottom:8px}
  .gauge{height:12px;background:#1a140c;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:12px 0}
  .gauge > span{display:block;height:100%;background:linear-gradient(90deg,#5f7f2a,var(--venom));transition:width .35s ease}
  .gauge.low > span{background:linear-gradient(90deg,#7a2f27,var(--blood))}
  .hp-amt{display:flex;gap:6px;margin-top:10px}
  .hp-amt input{flex:1}
  .hp-amt button{white-space:nowrap}
  .hp-quick{display:flex;gap:6px;justify-content:center;margin-top:8px}
  .hp-quick button{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:9px;padding:9px 0;font-weight:600;cursor:pointer}
  .hp-quick .dmg{color:#eab5ad;border-color:#5c342d}
  .hp-quick .heal{color:#cfe6a3;border-color:#41521f}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
  .stat .v{font-family:"Cinzel";font-size:24px}
  .stat .n{font-size:11px;color:var(--muted);margin-top:2px}
  .stat .b{font-size:10px;color:var(--muted);opacity:.8}
  .stat.up .v{color:var(--venom)} .stat.down .v{color:var(--blood)}

  /* Gold */
  .goldrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .goldval{font-family:"Cinzel";font-size:26px;color:var(--gold)}
  .goldctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .goldctrls input{width:100px}

  /* Survival */
  .surv{display:grid;gap:12px}
  .surv-row{display:flex;align-items:center;gap:10px}
  .surv-row .name{width:98px;font-size:13px}
  .pips{display:flex;gap:4px;flex:1}
  .pip{height:10px;flex:1;border-radius:3px;background:#1a140c;border:1px solid var(--line)}
  .surv-food .pip.on{background:var(--food)} .surv-water .pip.on{background:var(--water)} .surv-rest .pip.on{background:var(--rest)}
  .surv-row .eff{width:80px;text-align:right;font-size:12px;color:var(--muted)}
  .stepper{display:flex;gap:4px}
  .stepper button{width:30px;height:30px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;font-size:16px;cursor:pointer;line-height:1}

  /* Lists */
  .item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .item.locked{opacity:.55}
  .item .body{flex:1;min-width:0}
  .item .t{font-weight:500}
  .item .d{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
  .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
  .tag.eq{color:var(--venom);border-color:var(--venom)}
  .tag.dmg{color:#eab5ad;border-color:#5c342d}
  .tag.rank{color:var(--gold);border-color:var(--gold)}
  .tag.lock{color:#e0b56a;border-color:#6a4e22}
  .item .acts{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .qty{display:flex;align-items:center;gap:6px}
  .qty b{min-width:18px;text-align:center}
  .iconbtn{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:8px;cursor:pointer;font-size:13px;line-height:1}
  .iconbtn.danger{color:#eab5ad;border-color:#5c342d}
  .iconbtn.good{color:#cfe6a3;border-color:#41521f}
  .switch{position:relative;display:inline-block;width:42px;height:24px}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:#1a140c;border:1px solid var(--line);border-radius:999px;transition:.2s;cursor:pointer}
  .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:#33461a;border-color:var(--venom)}
  .switch input:checked + .slider:before{transform:translateX(18px);background:var(--venom)}

  .addrow{display:flex;gap:6px;margin-top:12px}
  .addrow input{flex:1;padding:9px 10px;font-size:14px}
  .addform{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:12px}
  .addform input,.addform select{padding:9px 10px;font-size:14px}
  .stateform{display:grid;grid-template-columns:1fr 1fr 70px auto;gap:6px;margin-top:12px}
  .stateform input,.stateform select{padding:9px 10px;font-size:13px}

  .biz{border-top:1px solid var(--line);padding:10px 0}
  .biz:first-child{border-top:none}
  .biz .tier{font-size:11px;color:var(--gold)}
  .log{font-size:12.5px;color:var(--muted);padding:4px 0;border-top:1px dashed var(--line)}
  .log:first-child{border-top:none}
  .log b{color:var(--ink);font-weight:500}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 0}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;width:100%;max-width:420px}
  .modal h3{color:var(--gold);margin-bottom:12px}
  .modal .field{margin:10px 0}
  .modal .check{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px}
  .modal .check input{width:auto}
  .modal .row{display:flex;gap:8px;margin-top:14px}
  .modal .row .btn{flex:1}

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:80}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="login-card">
    <div class="brand">NOCTUA</div>
    <div class="brand-sub">Fiches de personnage — Arkahet</div>
    <div class="rule"></div>
    <div class="field"><label for="email">Identifiant</label><input id="email" type="text" autocomplete="username" placeholder="prénom@noctua.local" /></div>
    <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" /></div>
    <button id="loginBtn" class="btn">Se connecter</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="wrap hidden">
  <div class="topbar">
    <select id="charSelect" class="hidden"></select>
    <span id="whoami" class="who"></span>
    <button id="logoutBtn" class="btn ghost mini">Déconnexion</button>
  </div>
  <div id="content"></div>
</div>

<!-- MODAL édition capacité -->
<div id="abModal" class="modal hidden">
  <div class="box">
    <h3 id="abTitle">Technique</h3>
    <input type="hidden" id="abId"><input type="hidden" id="abType">
    <div class="field"><label>Nom</label><input id="abName" /></div>
    <div class="field"><label>Description</label><textarea id="abDesc"></textarea></div>
    <div class="field" id="abRankField"><label>Rang (optionnel)</label><input id="abRank" type="number" inputmode="numeric" placeholder="ex. 1, 2, 3" /></div>
    <label class="check" id="abLockField"><input type="checkbox" id="abLocked"> À débloquer (verrouillée)</label>
    <div class="row"><button class="btn ghost" data-action="closemodal">Annuler</button><button class="btn" data-action="saveability">Enregistrer</button></div>
  </div>
</div>

<!-- MODAL édition objet -->
<div id="itModal" class="modal hidden">
  <div class="box">
    <h3>Objet</h3>
    <input type="hidden" id="itId">
    <div class="field"><label>Nom</label><input id="itName" /></div>
    <div class="field"><label>Catégorie</label>
      <select id="itCat"><option value="misc">Objet</option><option value="weapon">Arme</option><option value="consumable">Consommable</option><option value="quest">Quête</option></select></div>
    <div class="field"><label>Quantité</label><input id="itQty" type="number" inputmode="numeric" value="1" /></div>
    <div class="field"><label>Dégâts (armes, optionnel)</label><input id="itDamage" placeholder="ex. 1d10 flat 8" /></div>
    <div class="field"><label>Bonus de caractéristique (optionnel, s'applique quand l'objet est équipé)</label>
      <div style="display:flex;gap:6px">
        <select id="itStat" style="flex:1"><option value="">— aucune</option><option value="force">Force</option><option value="endurance">Endurance</option><option value="agilite">Agilité</option><option value="intelligence">Intelligence</option></select>
        <input id="itMod" type="number" inputmode="numeric" placeholder="±" style="width:90px" />
      </div>
    </div>
    <div class="field"><label>Description (optionnel)</label><textarea id="itDesc"></textarea></div>
    <div class="row"><button class="btn ghost" data-action="closeitem">Annuler</button><button class="btn" data-action="saveitem">Enregistrer</button></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ Config Supabase (clé publique, protégée par RLS) ============ */
const SB_URL = "https://zmbxaxjihswhrcrsvhrq.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptYnhheGppaHN3aHJjcnN2aHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTMzODYsImV4cCI6MjEwNDg2OTM4Nn0.nJra_6OpfJED2tVoUWLXJFst_kED56KpPm1wgpvvQpY";
const sb = supabase.createClient(SB_URL, SB_KEY);

let ME = { id:null, role:"player", name:"" };
let CHARS = [], CURRENT = null, CAN_EDIT = false, SHOW_ALL_LOG = false;

const PCT = {5:"+10%",4:"+5%",3:"0%",2:"-5%",1:"-10%",0:"-20%"};
const SURV = [
  {key:"food_level",  label:"Nourriture", cls:"surv-food",  stat:"Force"},
  {key:"water_level", label:"Eau",        cls:"surv-water", stat:"Agilité"},
  {key:"rest_level",  label:"Repos",      cls:"surv-rest",  stat:"Intelligence"},
];
const CAT_LABEL = {weapon:"Arme", consumable:"Consommable", quest:"Quête", misc:"Objet"};
const EQUIPABLE = ["weapon","misc"];
const STAT_LABEL = {force:"Force",endurance:"Endurance",agilite:"Agilité",intelligence:"Intelligence"};

const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gold = n => (n||0).toLocaleString("fr-FR");
let toastT; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);}

/* ============ Auth ============ */
async function login(){
  const email=$("#email").value.trim(), password=$("#password").value, msg=$("#loginMsg");
  msg.className="msg"; msg.textContent="Connexion…";
  if(!email||!password){ msg.className="msg err"; msg.textContent="Renseigne l'identifiant et le mot de passe."; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ msg.className="msg err"; msg.textContent="Identifiant ou mot de passe incorrect."; return; }
  msg.textContent=""; await boot();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

/* ============ Chargement ============ */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#login").classList.remove("hidden"); $("#app").classList.add("hidden"); return; }
  ME.id = session.user.id;
  const { data:prof } = await sb.from("profiles").select("display_name,role").eq("id",ME.id).maybeSingle();
  ME.role = prof?.role||"player"; ME.name = prof?.display_name||session.user.email;
  const { data:chars, error } = await sb.from("characters").select("*").order("name");
  if(error){ alert("Erreur de chargement : "+error.message); return; }
  CHARS = chars||[];
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#whoami").innerHTML = esc(ME.name)+(ME.role==="gm"?' <span class="roflag">MJ</span>':"");
  const sel=$("#charSelect");
  if(CHARS.length>1){ sel.classList.remove("hidden"); sel.innerHTML=CHARS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""); sel.onchange=()=>selectChar(sel.value); }
  else sel.classList.add("hidden");
  const mine=CHARS.find(c=>c.owner_id===ME.id); const start=(mine||CHARS[0])?.id;
  if(start){ sel.value=start; await selectChar(start); }
  else $("#content").innerHTML=`<div class="panel empty">Aucune fiche pour ce compte pour le moment.</div>`;
}
async function selectChar(id){ CURRENT=CHARS.find(c=>c.id===id); if(!CURRENT)return; CAN_EDIT=CURRENT.owner_id===ME.id; SHOW_ALL_LOG=false; await renderChar(); }
async function refreshCurrent(){ const {data}=await sb.from("characters").select("*").eq("id",CURRENT.id).maybeSingle(); if(data){CURRENT=data;const i=CHARS.findIndex(c=>c.id===data.id);if(i>=0)CHARS[i]=data;} }

/* ============ Rendu ============ */
async function renderChar(){
  const cid=CURRENT.id, c=CURRENT;
  const logQ = sb.from("event_log").select("*").eq("character_id",cid).order("created_at",{ascending:false});
  const [stats,inv,abil,eff,comp,biz,notes,logs] = await Promise.all([
    sb.from("character_effective_stats").select("*").eq("character_id",cid).maybeSingle(),
    sb.from("inventory_items").select("*").eq("character_id",cid).order("name"),
    sb.from("abilities").select("*").eq("character_id",cid).order("status").order("name"),
    sb.from("effects").select("*").eq("character_id",cid).order("name"),
    sb.from("companions").select("*").eq("character_id",cid).order("name"),
    sb.from("businesses").select("*").eq("character_id",cid).order("name"),
    sb.from("notes").select("*").eq("character_id",cid).order("created_at"),
    SHOW_ALL_LOG? logQ : logQ.limit(15),
  ]);
  const S=stats.data||{force_effective:0,endurance_effective:0,agilite_effective:0,intelligence_effective:0,hp_max:0};
  const hpMax=S.hp_max||0, hpPct=hpMax?Math.max(0,Math.min(100,Math.round(c.hp_current/hpMax*100))):0;
  const items=inv.data||[];
  CURRENT._items=items;
  const equipped=items.filter(i=>i.equipped), bag=items.filter(i=>!i.equipped);
  const techs=(abil.data||[]).filter(a=>a.type!=="passive");
  const passives=(abil.data||[]).filter(a=>a.type==="passive");
  const dis=CAN_EDIT?"":"disabled";
  const statCard=(l,b,e)=>`<div class="stat ${e>b?"up":(e<b?"down":"")}"><div class="v">${e}</div><div class="n">${l}</div><div class="b">base ${b}</div></div>`;

  $("#content").innerHTML = `
    <div class="idcard">
      <div class="idname">${esc(c.name)}</div>
      <div class="idmeta">${[c.title,c.origine,c.ordre].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="idmeta">${[c.armor?("Armure : "+esc(c.armor)):"",c.age?("Âge : "+esc(c.age)):""].filter(Boolean).join(" · ")}</div>
      ${!CAN_EDIT?`<div class="readonly-note">Lecture seule (fiche d'un autre joueur)</div>`:""}
      ${(CAN_EDIT&&c.notion_title)?`<div style="margin-top:12px"><button class="btn mini" data-action="syncnotion">Synchroniser vers Notion</button></div>`:""}
    </div>

    <div class="panel vitals">
      <div class="hp-label">POINTS DE VIE</div>
      <div class="hp-num">${c.hp_current}<small> / ${hpMax}</small></div>
      <div class="gauge ${hpPct<=25?"low":""}"><span style="width:${hpPct}%"></span></div>
      <div class="hp-amt">
        <input id="hpAmt" type="number" inputmode="numeric" placeholder="montant" ${dis}/>
        <button class="iconbtn danger" data-action="hpamt" data-sign="-1" ${dis}>− Dégâts</button>
        <button class="iconbtn good" data-action="hpamt" data-sign="1" ${dis}>+ Soin</button>
      </div>
      <div class="hp-quick">
        <button class="dmg" data-action="hp" data-d="-1" ${dis}>−1</button>
        <button class="heal" data-action="hp" data-d="1" ${dis}>+1</button>
        <button class="heal" data-action="hpfull" ${dis}>Plein</button>
      </div>
    </div>

    <div class="panel">
      <h2>Caractéristiques <span class="count">effectif · base</span></h2>
      <div class="stats">
        ${statCard("Force",c.force,S.force_effective)}
        ${statCard("Endurance",c.endurance,S.endurance_effective)}
        ${statCard("Agilité",c.agilite,S.agilite_effective)}
        ${statCard("Intelligence",c.intelligence,S.intelligence_effective)}
      </div>
    </div>

    <div class="panel">
      <h2>Survie</h2>
      <div class="surv">
        ${SURV.map(s=>{const lvl=c[s.key];const pips=Array.from({length:5},(_,i)=>`<span class="pip ${i<lvl?"on":""}"></span>`).join("");
          return `<div class="surv-row ${s.cls}"><div class="name">${s.label}<div class="muted" style="font-size:11px">${s.stat}</div></div>
            <div class="pips">${pips}</div><div class="eff">niv ${lvl} · ${PCT[lvl]}</div>
            <div class="stepper"><button data-action="surv" data-k="${s.key}" data-d="-1" ${dis}>−</button><button data-action="surv" data-k="${s.key}" data-d="1" ${dis}>+</button></div></div>`;
        }).join("")}
      </div>
    </div>

    <div class="panel">
      <h2>Or</h2>
      <div class="goldrow">
        <div class="goldval">${gold(c.gold)} <span class="muted" style="font-size:14px">po</span></div>
        <div class="goldctrls">
          <input id="goldAmt" type="number" inputmode="numeric" placeholder="montant" ${dis}/>
          <button class="iconbtn good" data-action="gold" data-sign="1" ${dis}>+ Gagner</button>
          <button class="iconbtn danger" data-action="gold" data-sign="-1" ${dis}>− Dépenser</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Armure <span class="count">réduction de dégâts</span></h2>
      <div class="goldrow">
        <div><div class="goldval" style="font-size:22px">${c.armor_reduction>0?"−"+c.armor_reduction:"0"}</div>${c.armor?`<div class="muted" style="font-size:12px">${esc(c.armor)}</div>`:""}</div>
        <div class="goldctrls">
          <button class="iconbtn" data-action="armor" data-v="1" ${dis}>Tissu −1</button>
          <button class="iconbtn" data-action="armor" data-v="2" ${dis}>Cuir −2</button>
          <button class="iconbtn" data-action="armor" data-v="3" ${dis}>Maille −3</button>
          <button class="iconbtn" data-action="armor" data-v="4" ${dis}>Plaque −4</button>
        </div>
      </div>
      ${CAN_EDIT?`<div class="addrow" style="margin-top:10px"><input id="armorManual" type="number" inputmode="numeric" placeholder="valeur manuelle (ex. 3 pour tissu+cuir)" /><button class="btn mini" data-action="armorset">Fixer</button></div>`:""}
    </div>

    <div class="panel">
      <h2>Équipement <span class="count">${equipped.length}</span></h2>
      ${equipped.length? equipped.map(it=>itemRow(it,true,dis)).join("") : `<div class="empty">Rien d'équipé.</div>`}
    </div>

    <div class="panel">
      <h2>Inventaire <span class="count">${bag.length}</span></h2>
      ${bag.length? bag.map(it=>itemRow(it,false,dis)).join("") : `<div class="empty">Sac vide.</div>`}
      ${CAN_EDIT?`<div class="addform">
        <input id="niName" placeholder="Nouvel objet" />
        <select id="niCat"><option value="misc">Objet</option><option value="weapon">Arme</option><option value="consumable">Consommable</option><option value="quest">Quête</option></select>
        <button class="btn mini" data-action="additem">Ajouter</button></div>
        <div style="margin-top:8px"><button class="btn mini ghost" data-action="newitem">+ Objet détaillé (avec bonus)</button></div>`:""}
    </div>

    <div class="panel">
      <h2>Techniques <span class="count">${techs.length}</span>${CAN_EDIT?`<button class="btn mini ghost" data-action="addability" data-type="technique">+ Ajouter</button>`:""}</h2>
      ${techs.filter(a=>a.status!=="locked").map(a=>abilityRow(a,dis)).join("") || `<div class="empty">Aucune technique.</div>`}
      ${techs.some(a=>a.status==="locked")?`<div class="subh">À débloquer</div>`+techs.filter(a=>a.status==="locked").map(a=>abilityRow(a,dis)).join(""):""}
    </div>

    <div class="panel">
      <h2>Capacités passives <span class="count">${passives.length}</span>${CAN_EDIT?`<button class="btn mini ghost" data-action="addability" data-type="passive">+ Ajouter</button>`:""}</h2>
      ${passives.map(a=>abilityRow(a,dis)).join("") || `<div class="empty">Aucune capacité passive.</div>`}
    </div>

    <div class="panel">
      <h2>États <span class="count">${(eff.data||[]).length}</span></h2>
      ${(eff.data||[]).length? eff.data.map(e=>{
        const label=[e.stat&&e.modifier?`${STAT_LABEL[e.stat]||e.stat} ${e.modifier>0?"+":""}${e.modifier}`:"",e.description?esc(e.description):""].filter(Boolean).join(" — ");
        return `<div class="item"><div class="body"><div class="t">${esc(e.name)}</div>${label?`<div class="d">${label}</div>`:""}</div>
          <div class="acts"><label class="switch"><input type="checkbox" data-action="effect" data-id="${e.id}" data-v="${e.is_active?0:1}" ${e.is_active?"checked":""} ${dis}><span class="slider"></span></label>
          <button class="iconbtn danger" data-action="deleffect" data-id="${e.id}" ${dis}>✕</button></div></div>`;
      }).join("") : `<div class="empty">Aucun état actif.</div>`}
      ${CAN_EDIT?`<div class="stateform">
        <input id="stName" placeholder="Nom de l'état" />
        <select id="stStat"><option value="">— aucune carac.</option><option value="force">Force</option><option value="endurance">Endurance</option><option value="agilite">Agilité</option><option value="intelligence">Intelligence</option></select>
        <input id="stMod" type="number" inputmode="numeric" placeholder="±" />
        <button class="btn mini" data-action="addeffect">Ajouter</button></div>`:""}
    </div>

    <div class="panel">
      <h2>Notes <span class="count">${(notes.data||[]).length}</span></h2>
      ${(notes.data||[]).length? notes.data.map(n=>`<div class="item"><div class="body"><div class="t" style="font-weight:400">${esc(n.content)}</div></div>${CAN_EDIT?`<div class="acts"><button class="iconbtn danger" data-action="delnote" data-id="${n.id}">✕</button></div>`:""}</div>`).join("") : `<div class="empty">Aucune note.</div>`}
      ${CAN_EDIT?`<div class="addrow"><input id="noteInput" placeholder="Nouvelle note" /><button class="btn mini" data-action="addnote">Ajouter</button></div>`:""}
    </div>

    <div class="panel">
      <h2>Compagnons <span class="count">${(comp.data||[]).length}</span></h2>
      ${(comp.data||[]).length? comp.data.map(k=>`<div class="item"><div class="body"><div class="t">${esc(k.name)}</div>${(k.type||k.description)?`<div class="d">${[k.type,k.description].filter(Boolean).map(esc).join(" — ")}</div>`:""}</div></div>`).join("") : `<div class="empty">Aucun compagnon.</div>`}
    </div>

    ${(biz.data||[]).length?`<div class="panel"><h2>Commerces <span class="count">${biz.data.length}</span></h2>
      ${biz.data.map(b=>`<div class="biz"><div class="t">${esc(b.name||b.kind||"Commerce")} <span class="tier">Tier ${b.tier}</span></div>
        <div class="d">Investi : ${gold(b.invested_gold)} po · Revenu moyen : ${gold(b.base_income)} po/session</div>${b.notes?`<div class="d">${esc(b.notes)}</div>`:""}</div>`).join("")}</div>`:""}

    <div class="panel">
      <h2>Historique <span class="count">${SHOW_ALL_LOG?"tout":"15 dernières"}</span></h2>
      ${(logs.data&&logs.data.length)? logs.data.map(l=>{
        const d=new Date(l.created_at).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
        const delta=(l.delta!=null)?` (${l.delta>0?"+":""}${l.delta})`:"";
        return `<div class="log"><b>${esc(l.description||l.event_type)}</b>${delta} · <span>${d}</span></div>`;
      }).join("") : `<div class="empty">Aucune action enregistrée.</div>`}
      <div style="margin-top:12px"><button class="btn ghost mini" data-action="togglelog">${SHOW_ALL_LOG?"Réduire":"Voir tout l'historique"}</button></div>
    </div>
  `;
}

function itemRow(it,isEquip,dis){
  const tags=[
    it.damage?`<span class="tag dmg">${esc(it.damage)}</span>`:"",
    (it.category&&it.category!=="misc")?`<span class="tag">${CAT_LABEL[it.category]||esc(it.category)}</span>`:"",
    (it.stat&&it.modifier)?`<span class="tag">${STAT_LABEL[it.stat]||esc(it.stat)} ${it.modifier>0?"+":""}${it.modifier}</span>`:"",
  ].join("");
  const equipBtn = isEquip
    ? `<button class="iconbtn" data-action="equip" data-id="${it.id}" data-v="0" ${dis}>Déséquiper</button>`
    : (EQUIPABLE.includes(it.category)?`<button class="iconbtn good" data-action="equip" data-id="${it.id}" data-v="1" ${dis}>Équiper</button>`:"");
  return `<div class="item"><div class="body"><div class="t">${esc(it.name)}${tags}</div>${it.description?`<div class="d">${esc(it.description)}</div>`:""}</div>
    <div class="acts">
      <div class="qty"><button class="iconbtn" data-action="qty" data-id="${it.id}" data-d="-1" ${dis}>−</button><b>${it.quantity}</b><button class="iconbtn" data-action="qty" data-id="${it.id}" data-d="1" ${dis}>+</button></div>
      ${equipBtn}
      ${dis?"":`<button class="iconbtn" data-action="edititem" data-id="${it.id}">Modifier</button>`}
      <button class="iconbtn danger" data-action="delitem" data-id="${it.id}" ${dis}>✕</button>
    </div></div>`;
}
function abilityRow(a,dis){
  const locked=a.status==="locked";
  const tags=[a.rank?`<span class="tag rank">Rang ${a.rank}</span>`:"", locked?`<span class="tag lock">à débloquer</span>`:""].join("");
  const acts=CAN_EDIT?`<div class="acts">
    ${locked?`<button class="iconbtn good" data-action="unlock" data-id="${a.id}">Débloquer</button>`:""}
    <button class="iconbtn" data-action="editability" data-id="${a.id}">Modifier</button>
    <button class="iconbtn danger" data-action="delability" data-id="${a.id}">✕</button></div>`:"";
  return `<div class="item ${locked?"locked":""}"><div class="body"><div class="t">${esc(a.name)}${tags}</div>${a.description?`<div class="d">${esc(a.description)}</div>`:""}</div>${acts}</div>`;
}

/* ============ Écritures ============ */
async function logEvent(type,desc,delta){ try{ await sb.from("event_log").insert({character_id:CURRENT.id,event_type:type,description:desc,delta:delta??null}); }catch(e){} }
async function afterChar(){ await refreshCurrent(); await renderChar(); }

async function hpMaxNow(){ const {data}=await sb.from("character_effective_stats").select("hp_max").eq("character_id",CURRENT.id).maybeSingle(); return data?.hp_max ?? CURRENT.hp_current; }
async function changeHP(delta){
  const max=await hpMaxNow(); const next=Math.max(0,Math.min(max,CURRENT.hp_current+delta)); const real=next-CURRENT.hp_current;
  if(real===0){ toast(delta<0?"Déjà à 0":"Déjà au max"); return; }
  const {error}=await sb.from("characters").update({hp_current:next}).eq("id",CURRENT.id); if(error)return toast("Échec : "+error.message);
  await logEvent("hp",real<0?"Perte de vie":"Gain de vie",real); toast(`PV ${real>0?"+":""}${real}`); await afterChar();
}
async function hpAmt(sign){ const v=parseInt($("#hpAmt").value,10); if(!v||v<=0)return toast("Entre un montant"); await changeHP(sign*v); }
async function fullHeal(){ const max=await hpMaxNow(); const real=max-CURRENT.hp_current;
  const {error}=await sb.from("characters").update({hp_current:max}).eq("id",CURRENT.id); if(error)return toast("Échec : "+error.message);
  if(real)await logEvent("hp","Soin complet",real); toast("Vie au maximum"); await afterChar(); }
async function changeGold(sign){ const amt=parseInt($("#goldAmt").value,10); if(!amt||amt<=0)return toast("Entre un montant");
  const delta=sign*amt, next=Math.max(0,CURRENT.gold+delta);
  const {error}=await sb.from("characters").update({gold:next}).eq("id",CURRENT.id); if(error)return toast("Échec : "+error.message);
  await logEvent("gold",delta<0?"Dépense d'or":"Gain d'or",delta); toast(`Or ${delta>0?"+":""}${gold(delta)}`); await afterChar(); }
async function changeSurv(key,d){ const lvl=Math.max(0,Math.min(5,CURRENT[key]+d)); if(lvl===CURRENT[key])return;
  const {error}=await sb.from("characters").update({[key]:lvl}).eq("id",CURRENT.id); if(error)return toast("Échec : "+error.message);
  const names={food_level:"Nourriture",water_level:"Eau",rest_level:"Repos"}; await logEvent("survie",`${names[key]} → niveau ${lvl}`); await afterChar(); }

async function changeQty(id,d){ const {data:it}=await sb.from("inventory_items").select("quantity,name").eq("id",id).maybeSingle(); if(!it)return;
  const q=it.quantity+d; if(q<=0){ await sb.from("inventory_items").delete().eq("id",id); await logEvent("objet",`Retiré : ${it.name}`); } else await sb.from("inventory_items").update({quantity:q}).eq("id",id); await renderChar(); }
async function toggleEquip(id,v){ const {error}=await sb.from("inventory_items").update({equipped:!!v}).eq("id",id); if(error)return toast("Échec : "+error.message); await renderChar(); }
async function delItem(id){ const {data:it}=await sb.from("inventory_items").select("name").eq("id",id).maybeSingle(); await sb.from("inventory_items").delete().eq("id",id); if(it)await logEvent("objet",`Retiré : ${it.name}`); toast("Objet retiré"); await renderChar(); }
async function addItem(){ const name=$("#niName").value.trim(), category=$("#niCat").value; if(!name)return toast("Nom de l'objet ?");
  const {error}=await sb.from("inventory_items").insert({character_id:CURRENT.id,name,category}); if(error)return toast("Échec : "+error.message); await logEvent("objet",`Ajouté : ${name}`); toast("Objet ajouté"); await renderChar(); }

/* Objet : modal détaillé (avec bonus de carac) */
function openItem(id){
  const it=id?(CURRENT._items||[]).find(x=>x.id===id)||{}:{};
  $("#itId").value=id||"";
  $("#itName").value=it.name||""; $("#itCat").value=it.category||"misc";
  $("#itQty").value=it.quantity??1; $("#itDamage").value=it.damage||"";
  $("#itStat").value=it.stat||""; $("#itMod").value=it.modifier??"";
  $("#itDesc").value=it.description||"";
  $("#itModal").classList.remove("hidden");
}
function closeItem(){ $("#itModal").classList.add("hidden"); }
async function saveItem(){
  const id=$("#itId").value, name=$("#itName").value.trim();
  if(!name)return toast("Nom requis");
  const stat=$("#itStat").value||null; const modRaw=$("#itMod").value;
  const row={
    name, category:$("#itCat").value,
    quantity:parseInt($("#itQty").value,10)||1,
    damage:$("#itDamage").value.trim()||null,
    stat, modifier:(stat&&modRaw!=="")?parseInt(modRaw,10):null,
    description:$("#itDesc").value.trim()||null,
  };
  let error;
  if(id){ ({error}=await sb.from("inventory_items").update(row).eq("id",id)); }
  else { row.character_id=CURRENT.id; ({error}=await sb.from("inventory_items").insert(row)); await logEvent("objet",`Ajouté : ${name}`); }
  if(error)return toast("Échec : "+error.message);
  closeItem(); toast("Objet enregistré"); await renderChar();
}

/* Armure : réduction de dégâts */
async function setArmor(v){
  const {error}=await sb.from("characters").update({armor_reduction:v}).eq("id",CURRENT.id);
  if(error)return toast("Échec : "+error.message);
  await afterChar();
}
async function setArmorManual(){ const v=parseInt($("#armorManual").value,10); if(isNaN(v)||v<0)return toast("Valeur invalide"); await setArmor(v); }


async function addNote(){ const content=$("#noteInput").value.trim(); if(!content)return toast("Note vide"); const {error}=await sb.from("notes").insert({character_id:CURRENT.id,content}); if(error)return toast("Échec : "+error.message); await renderChar(); }
async function delNote(id){ await sb.from("notes").delete().eq("id",id); await renderChar(); }

async function addEffect(){ const name=$("#stName").value.trim(); if(!name)return toast("Nom de l'état ?");
  const stat=$("#stStat").value||null; const mod=parseInt($("#stMod").value,10);
  const row={character_id:CURRENT.id,name,is_active:true}; if(stat){row.stat=stat; if(!isNaN(mod))row.modifier=mod;}
  const {error}=await sb.from("effects").insert(row); if(error)return toast("Échec : "+error.message); await logEvent("etat",`État ajouté : ${name}`); await renderChar(); }
async function delEffect(id){ const {data:e}=await sb.from("effects").select("name").eq("id",id).maybeSingle(); await sb.from("effects").delete().eq("id",id); if(e)await logEvent("etat",`État retiré : ${e.name}`); await renderChar(); }
async function toggleEffect(id,v){ const {error}=await sb.from("effects").update({is_active:!!v}).eq("id",id); if(error)return toast("Échec : "+error.message); await renderChar(); }

/* Capacités : modal */
function openAbility(id,type){
  const isTech=(type||"technique")!=="passive";
  $("#abId").value=id||""; $("#abType").value=type||"technique";
  $("#abTitle").textContent=(isTech?"Technique":"Capacité passive");
  $("#abRankField").style.display=isTech?"":"none"; $("#abLockField").style.display=isTech?"":"none";
  if(id){ const a=CURRENT._abils.find(x=>x.id===id)||{}; $("#abName").value=a.name||""; $("#abDesc").value=a.description||""; $("#abRank").value=a.rank??""; $("#abLocked").checked=a.status==="locked"; }
  else { $("#abName").value=""; $("#abDesc").value=""; $("#abRank").value=""; $("#abLocked").checked=false; }
  $("#abModal").classList.remove("hidden");
}
function closeModal(){ $("#abModal").classList.add("hidden"); }
async function saveAbility(){
  const id=$("#abId").value, type=$("#abType").value, name=$("#abName").value.trim();
  if(!name)return toast("Nom requis");
  const rankRaw=$("#abRank").value, rank=(type==="technique"&&rankRaw!=="")?parseInt(rankRaw,10):null;
  const status=(type==="technique"&&$("#abLocked").checked)?"locked":"unlocked";
  const desc=$("#abDesc").value.trim()||null;
  let error;
  if(id){ ({error}=await sb.from("abilities").update({name,description:desc,rank,status}).eq("id",id)); }
  else { ({error}=await sb.from("abilities").insert({character_id:CURRENT.id,type,name,description:desc,rank,status})); await logEvent("capacite",`Ajout : ${name}`); }
  if(error)return toast("Échec : "+error.message); closeModal(); toast("Enregistré"); await renderChar();
}
async function unlockAbility(id){ const {data:a}=await sb.from("abilities").select("name").eq("id",id).maybeSingle(); await sb.from("abilities").update({status:"unlocked"}).eq("id",id); if(a)await logEvent("capacite",`Débloqué : ${a.name}`); toast("Débloquée"); await renderChar(); }
async function delAbility(id){ await sb.from("abilities").delete().eq("id",id); await renderChar(); }

/* garder les capacités en mémoire pour le modal */
const _origRender=renderChar;
renderChar=async function(){ await _origRender(); const {data}=await sb.from("abilities").select("*").eq("character_id",CURRENT.id); CURRENT._abils=data||[]; };

/* ============ Synchro Notion ============ */
async function syncNotion(){
  toast("Synchronisation…");
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const res = await fetch(SB_URL+"/functions/v1/sync-notion", {
      method:"POST",
      headers:{ "Authorization":`Bearer ${session.access_token}`, "apikey":SB_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ character_id: CURRENT.id }),
    });
    const j = await res.json().catch(()=>({}));
    toast(j.ok ? "Synchronisé vers Notion ✓" : ("Notion : "+(j.message||"échec")));
    if(j.ok) await refreshCurrent();
  }catch(e){ toast("Notion : erreur réseau"); }
}

/* ============ Délégation ============ */
document.addEventListener("click",(e)=>{
  const b=e.target.closest("[data-action]"); if(!b)return; const a=b.dataset.action;
  if(a==="hp")changeHP(parseInt(b.dataset.d,10));
  else if(a==="hpamt")hpAmt(parseInt(b.dataset.sign,10));
  else if(a==="hpfull")fullHeal();
  else if(a==="gold")changeGold(parseInt(b.dataset.sign,10));
  else if(a==="surv")changeSurv(b.dataset.k,parseInt(b.dataset.d,10));
  else if(a==="qty")changeQty(b.dataset.id,parseInt(b.dataset.d,10));
  else if(a==="equip")toggleEquip(b.dataset.id,parseInt(b.dataset.v,10));
  else if(a==="delitem")delItem(b.dataset.id);
  else if(a==="additem")addItem();
  else if(a==="newitem")openItem(null);
  else if(a==="edititem")openItem(b.dataset.id);
  else if(a==="saveitem")saveItem();
  else if(a==="closeitem")closeItem();
  else if(a==="armor")setArmor(parseInt(b.dataset.v,10));
  else if(a==="armorset")setArmorManual();
  else if(a==="addnote")addNote();
  else if(a==="delnote")delNote(b.dataset.id);
  else if(a==="addeffect")addEffect();
  else if(a==="deleffect")delEffect(b.dataset.id);
  else if(a==="addability")openAbility(null,b.dataset.type);
  else if(a==="editability")openAbility(b.dataset.id,(CURRENT._abils.find(x=>x.id===b.dataset.id)||{}).type);
  else if(a==="delability")delAbility(b.dataset.id);
  else if(a==="unlock")unlockAbility(b.dataset.id);
  else if(a==="saveability")saveAbility();
  else if(a==="closemodal")closeModal();
  else if(a==="syncnotion")syncNotion();
  else if(a==="togglelog"){ SHOW_ALL_LOG=!SHOW_ALL_LOG; renderChar(); }
});
document.addEventListener("change",(e)=>{ const b=e.target.closest("[data-action='effect']"); if(b)toggleEffect(b.dataset.id,parseInt(b.dataset.v,10)); });

$("#loginBtn").addEventListener("click",login);
$("#password").addEventListener("keydown",e=>{ if(e.key==="Enter")login(); });
$("#logoutBtn").addEventListener("click",logout);
boot();
</script>
</body>
</html>
